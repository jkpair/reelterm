version: 2
project_name: yt-x

before:
  hooks:
    - go mod tidy
    - go test ./...
    - sh -c "mkdir -p completions && go run ./cmd/yt-x completions --bash > completions/yt-x.bash && go run ./cmd/yt-x completions --fish > completions/yt-x.fish && go run ./cmd/yt-x completions --zsh > completions/_yt-x"

builds:
  - id: yt-x
    main: ./cmd/yt-x
    binary: yt-x
    env:
      - CGO_ENABLED=0 # fully static: runs on any distro, glibc or musl
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/jkpair/yt-x-plus/internal/app.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: arm64 }

archives:
  # Raw binaries named yt-x-<os>-<arch>: what `yt-x --update`, install.sh
  # and the old Bash script's updater download.
  - id: binary
    formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  # Tarballs with docs, completions and the example plugin.
  - id: tarball
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - plugins/example.lua
      - completions/*

nfpms:
  - id: packages
    package_name: yt-x
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    vendor: jkpair
    homepage: https://github.com/jkpair/yt-x-plus
    maintainer: jkpair <jkpair@users.noreply.github.com>
    description: Browse, stream and download YouTube from your terminal.
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    # Recommended rather than required: package names differ between
    # distros (ffmpeg needs RPM Fusion on Fedora) and `yt-x --install`
    # sets them up with the system package manager.
    recommends: [yt-dlp, mpv, ffmpeg]
    suggests: [chafa, libnotify, wl-clipboard]
    overrides:
      archlinux:
        suggests: [yt-dlp, mpv, ffmpeg, chafa, libnotify, wl-clipboard]
    contents:
      - src: completions/yt-x.bash
        dst: /usr/share/bash-completion/completions/yt-x
      - src: completions/yt-x.fish
        dst: /usr/share/fish/vendor_completions.d/yt-x.fish
      - src: completions/_yt-x
        dst: /usr/share/zsh/site-functions/_yt-x
      - src: plugins/example.lua
        dst: /usr/share/yt-x/plugins/example.lua
      - src: packaging/yt-x.desktop
        dst: /usr/share/applications/yt-x.desktop
      - src: LICENSE
        dst: /usr/share/licenses/yt-x/LICENSE

checksum:
  name_template: checksums.txt

release:
  github:
    owner: jkpair
    name: yt-x-plus
  extra_files:
    - glob: ./install.sh

changelog:
  use: git
  sort: asc
  groups:
    - { title: Features, regexp: '^feat', order: 0 }
    - { title: Fixes, regexp: '^fix', order: 1 }
    - { title: Other, order: 9 }
  filters:
    exclude: ['^docs', '^chore: bump version']
