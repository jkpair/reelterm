version: 2
project_name: reelterm

before:
  hooks:
    - go mod tidy
    - go test ./...
    - sh -c "mkdir -p completions && go run ./cmd/reelterm completions --bash > completions/reelterm.bash && go run ./cmd/reelterm completions --fish > completions/reelterm.fish && go run ./cmd/reelterm completions --zsh > completions/_reelterm"

builds:
  - id: reelterm
    main: ./cmd/reelterm
    binary: reelterm
    env:
      - CGO_ENABLED=0 # fully static: runs on any distro, glibc or musl
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/jkpair/reelterm/internal/app.Version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: windows, goarch: arm }
      - { goos: windows, goarch: arm64 }

archives:
  # Raw binaries named reelterm-<os>-<arch>: what `reelterm --update`,
  # install.sh and the migration script download.
  - id: binary
    formats: [binary]
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  # The same binaries under the pre-rename name, which `--update` in
  # yt-x 1.0.x looks for.
  - id: legacy-binary
    formats: [binary]
    name_template: "yt-x-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
  # Tarballs with docs, completions and the example plugin.
  - id: tarball
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - README.md
      - LICENSE
      - plugins/example.lua
      - completions/*

nfpms:
  - id: packages
    package_name: reelterm
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    vendor: jkpair
    homepage: https://github.com/jkpair/reelterm
    maintainer: jkpair <jkpair@users.noreply.github.com>
    description: Browse, stream and download YouTube from your terminal.
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    bindir: /usr/bin
    # Recommended rather than required: package names differ between
    # distros (ffmpeg needs RPM Fusion on Fedora) and `reelterm --install`
    # sets them up with the system package manager.
    recommends: [yt-dlp, mpv, ffmpeg]
    suggests: [chafa, libnotify, wl-clipboard]
    overrides:
      archlinux:
        suggests: [yt-dlp, mpv, ffmpeg, chafa, libnotify, wl-clipboard]
    contents:
      - src: completions/reelterm.bash
        dst: /usr/share/bash-completion/completions/reelterm
      - src: completions/reelterm.fish
        dst: /usr/share/fish/vendor_completions.d/reelterm.fish
      - src: completions/_reelterm
        dst: /usr/share/zsh/site-functions/_reelterm
      - src: plugins/example.lua
        dst: /usr/share/reelterm/plugins/example.lua
      - src: packaging/reelterm.desktop
        dst: /usr/share/applications/reelterm.desktop
      - src: LICENSE
        dst: /usr/share/licenses/reelterm/LICENSE

checksum:
  name_template: checksums.txt

release:
  github:
    owner: jkpair
    name: reelterm
  extra_files:
    - glob: ./install.sh

changelog:
  use: git
  sort: asc
  groups:
    - { title: Features, regexp: '^feat', order: 0 }
    - { title: Fixes, regexp: '^fix', order: 1 }
    - { title: Other, order: 9 }
  filters:
    exclude: ['^docs', '^chore: bump version']
